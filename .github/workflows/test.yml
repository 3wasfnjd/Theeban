name: اختبارات ذيبان
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22 }
      - name: اختبارات المنطق (الحراس، الرؤية، الزحف، نقاط الحفظ)
        run: node --test tests/logic.test.js tests/levels.test.js
      - name: تثبيت متصفح الاختبار
        run: |
          npm install --no-save playwright@1.48.2
          npx playwright install --with-deps chromium
      - name: فحص في المتصفح بمقاس آيفون بالعرض
        run: node tests/smoke.js
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: theeban-screenshots
          path: build/*.png
          retention-days: 14
